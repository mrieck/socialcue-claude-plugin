<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Inter';
    src: url('fonts/inter-500.woff2') format('woff2');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Inter';
    src: url('fonts/inter-800.woff2') format('woff2');
    font-weight: 800;
  }
  * { margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; }
  .card {
    position: relative;
    width: 1280px; height: 640px;
    background:
      radial-gradient(600px 420px at 96% -12%, #ffe3c2 0%, rgba(255,227,194,0) 72%),
      radial-gradient(560px 400px at 4% 112%, #ffe9d6 0%, rgba(255,233,214,0) 70%),
      radial-gradient(480px 360px at 72% 118%, #fbe3cc 0%, rgba(251,227,204,0) 68%),
      linear-gradient(135deg, #fdf9f4 0%, #faf3ea 55%, #f9efe3 100%);
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  svg.art { position: absolute; inset: 0; }
  .word {
    position: absolute; left: 548px; top: 218px;
    font-size: 96px; font-weight: 800; letter-spacing: -2.5px;
    color: #1d222b;
  }
  .word .accent { color: #e05d1a; }
  .tag {
    position: absolute; left: 553px; top: 348px;
    font-size: 33px; font-weight: 500;
    color: #8a7a68;
  }
  .rule {
    position: absolute; left: 555px; top: 410px;
    width: 118px; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, #f2870d, #e05d1a);
  }
</style>
</head>
<body>
<div class="card">

<svg class="art" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2870d"/>
      <stop offset="1" stop-color="#c2440a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2870d"/>
      <stop offset="1" stop-color="#e05d1a"/>
    </linearGradient>
  </defs>

  <!-- faint oversized signal arcs, top right -->
  <g fill="none" stroke="#e8b98a" stroke-linecap="round" opacity="0.5">
    <path d="M1148 66 A84 84 0 0 1 1148 182" stroke-width="9"/>
    <path d="M1184 38 A132 132 0 0 1 1184 210" stroke-width="9"/>
    <circle cx="1110" cy="124" r="15" fill="#e8b98a" stroke="none"/>
  </g>

  <!-- confetti: dots + squares in warm pastels -->
  <g>
    <circle cx="600" cy="84" r="6" fill="#f6c188"/>
    <rect x="760" y="110" width="12" height="12" rx="4" fill="#f0a26b" transform="rotate(18 766 116)" opacity="0.8"/>
    <circle cx="920" cy="70" r="5" fill="#e5cdb2"/>
    <rect x="1010" y="170" width="11" height="11" rx="4" fill="#f6c188" transform="rotate(-24 1015 175)"/>
    <circle cx="1246" cy="330" r="6" fill="#f6c188"/>
    <rect x="1180" y="420" width="12" height="12" rx="4" fill="#e5cdb2" transform="rotate(30 1186 426)"/>
    <circle cx="1064" cy="486" r="7" fill="#f0a26b" opacity="0.75"/>
    <rect x="900" y="470" width="11" height="11" rx="4" fill="#f6c188" transform="rotate(-15 905 475)"/>
    <circle cx="742" cy="500" r="5" fill="#e5cdb2"/>
    <circle cx="524" cy="98" r="5" fill="#e05d1a" opacity="0.55"/>
    <rect x="470" y="480" width="11" height="11" rx="4" fill="#f6c188" transform="rotate(12 475 485)"/>
    <circle cx="70" cy="88" r="6" fill="#f0a26b" opacity="0.7"/>
    <rect x="136" y="54" width="12" height="12" rx="4" fill="#f6c188" transform="rotate(-20 142 60)"/>
    <circle cx="228" cy="96" r="5" fill="#e5cdb2"/>
    <circle cx="404" cy="64" r="6" fill="#f6c188"/>
  </g>

  <!-- hero art: the Social Cue mark + a scored conversation, left -->
  <g transform="translate(78,140)">
    <!-- soft shadow -->
    <ellipse cx="190" cy="330" rx="212" ry="26" fill="#dcae83" opacity="0.35"/>

    <!-- the mark: orange tile + white bubble + cue (icon.svg scaled 2.2x) -->
    <g transform="rotate(-4 140 140)">
      <g transform="scale(2.2)">
        <rect width="128" height="128" rx="28" fill="url(#tile)"/>
        <path fill="#ffffff" d="M40 26 h48 a18 18 0 0 1 18 18 v26 a18 18 0 0 1 -18 18 H58 l-16 16 v-16 h-2 a18 18 0 0 1 -18 -18 V44 a18 18 0 0 1 18 -18 Z"/>
        <circle cx="48" cy="57" r="8" fill="#c94f10"/>
        <path d="M59 46 A16 16 0 0 1 59 68" fill="none" stroke="#c94f10" stroke-width="8" stroke-linecap="round"/>
        <path d="M67 39 A27 27 0 0 1 67 75" fill="none" stroke="#c94f10" stroke-width="8" stroke-linecap="round"/>
      </g>
    </g>

    <!-- a found conversation: white card overlapping the tile, score chip -->
    <g transform="translate(196,152) rotate(3)">
      <rect x="0" y="0" width="252" height="150" rx="20" fill="#fffdfa" stroke="#1d222b" stroke-width="6"/>
      <rect x="26" y="28" width="132" height="14" rx="7" fill="#e5cdb2"/>
      <rect x="26" y="58" width="180" height="14" rx="7" fill="#efe2d0"/>
      <rect x="26" y="88" width="150" height="14" rx="7" fill="#efe2d0"/>
      <g transform="translate(26,112)">
        <rect x="0" y="0" width="118" height="26" rx="13" fill="#fbd9bd"/>
        <rect x="14" y="8" width="66" height="9" rx="4.5" fill="#c94f10"/>
      </g>
      <g transform="translate(186,-24) rotate(6)">
        <rect x="0" y="0" width="96" height="52" rx="16" fill="url(#chip)" stroke="#fffdfa" stroke-width="5"/>
        <text x="48" y="36" text-anchor="middle" font-family="Inter" font-weight="800" font-size="28" fill="#fffdfa">9/10</text>
      </g>
    </g>
  </g>

  <!-- bottom bar: a row of little conversation bubbles -->
  <g>
    <rect x="0" y="596" width="1280" height="44" fill="#1d222b"/>
  </g>
</svg>

<div class="word">Social&nbsp;<span class="accent">Cue</span></div>
<div class="tag">Find the conversations worth joining.</div>
<div class="rule"></div>

</div>
</body>
</html>
